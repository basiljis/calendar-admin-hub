<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сервис временно недоступен</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0f172a; color: #e2e8f0;
      }
      .card {
        max-width: 480px; padding: 40px; border-radius: 24px; text-align: center;
        background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
      }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { margin: 0; line-height: 1.6; color: #94a3b8; font-size: 15px; }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; margin-right: 8px; animation: pulse 1.4s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }
    </style>
  </head>
  <body>
    <main class="card">
      <h1><span class="dot"></span>Обновляем систему</h1>
      <p>Сервис временно недоступен — идёт обновление. Страница обновится автоматически через минуту.</p>
    </main>
    <script>
      setTimeout(function () { location.reload(); }, 60000);
    </script>
  </body>
</html>
