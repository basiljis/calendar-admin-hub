services:
  edge:
    build:
      context: ./edge
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-psygrafik.ru}
      API_DOMAIN: ${API_DOMAIN:-api.psygrafik.ru}
      SUPABASE_UPSTREAM: ${SUPABASE_UPSTREAM:-muuthcezvdaltiylcssh.supabase.co}
    ports:
      - "8082:8080"
    volumes:
      - maintenance_flags:/etc/nginx/flags
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://api.psygrafik.ru}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_FFHC63ee28cD2WTX-nz5pQ_2wS1byHf}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-muuthcezvdaltiylcssh}
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-https://api.psygrafik.ru}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_FFHC63ee28cD2WTX-nz5pQ_2wS1byHf}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  maintenance_flags:
